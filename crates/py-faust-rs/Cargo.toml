# Standalone crate: intentionally its own workspace root so the PyO3 cdylib and
# its `extension-module` linkage never enter `cargo build --workspace` or CI.
# It path-depends on the main workspace crates, which resolve their own
# `*.workspace = true` inheritance against the root faust-rs workspace.
[workspace]

[package]
name = "py-faust-rs"
version = "0.8.0"
edition = "2024"
license = "LGPL-2.1-or-later"
authors = ["faust-rs contributors"]
description = "Proof-of-concept PyO3 Python bindings for faust-rs (interpreter and Cranelift backends)"
publish = false

# The binding contains no hand-written `unsafe` (the `faust` crate owns the
# backend pointers), but PyO3's `#[pyclass]`/`#[pymethods]` macros expand
# to `unsafe` impls, so the workspace-wide `unsafe_code = forbid` must be relaxed.
[lints.rust]
unsafe_code = "allow"

[lib]
name = "faust_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
faust = { path = "../faust" }
